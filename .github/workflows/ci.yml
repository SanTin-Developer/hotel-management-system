name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hotel_management
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user -d hotel_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hotel_management_test
      DB_USERNAME: hotel_user
      DB_PASSWORD: hotel_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, mbstring, xml, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "cache-dir=$(composer config -g cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.cache-dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        run: psql -h 127.0.0.1 -U hotel_user -d hotel_management -c "CREATE DATABASE hotel_management_test;"
        env:
          PGPASSWORD: hotel_password

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Run Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests
        run: php artisan test

  backend-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hotel-backend ./backend
